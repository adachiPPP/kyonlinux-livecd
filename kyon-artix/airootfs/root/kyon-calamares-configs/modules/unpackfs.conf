#
# Unsquash / unpack a filesystem. Multiple sources are supported, and
# they may be squashed or plain filesystems.
#
# Configuration:
#
#   from globalstorage: rootMountPoint
#   from job.configuration: the path to where to mount the source image(s)
#       for copying an ordered list of unpack mappings for image file <->
#       target dir relative to rootMountPoint.

---
# Each list item is unpacked, in order, to the target system.
#
# Each list item has the following **mandatory** attributes:
#   - *source* path relative to the live / installing system to the image
#   - *sourcefs* the type of the source files; valid entries are
#       - `ext4` (copies the filesystem contents)
#       - `squashfs` (unsquashes)
#       - `file` (copies a file or directory)
#       - (may be others if mount supports it)
#   - *destination* path relative to rootMountPoint (so in the target
#       system) where this filesystem is unpacked. It may be an
#       empty string, which effectively is / (the root) of the target
#       system.
#
# Each list item **optionally** can include the following attributes:
#   - *exclude* is a list of values that is expanded into --exclude
#       arguments for rsync (each entry in exclude gets its own --exclude).
#   - *excludeFile* is a single file that is passed to rsync as an
#       --exclude-file argument. This should be a full pathname
#       inside the **host** filesystem.
#   - *weight* is useful when the entries take wildly different
#       times to unpack (e.g. with a squashfs, and one single file)
#       and the total weight of this module should be distributed
#       differently between the entries. (This is only relevant when
#       there is more than one entry; by default all the entries
#       have the same weight, 1)
#   - *optional* (Artix calamares 3.4.x supports it): when true, a
#       missing source is skipped instead of failing the whole module.
#
# If a listed source does not exist, it is skipped when optional: true.
# The standard path for this ISO (archisobasedir=artix) is required;
# the additional entries cover Ventoy / Rufus ISO mode and simplified
# layouts and are all optional. shellprocess@fix_boot_media runs before
# unpackfs and links airootfs.sfs into the standard path as a fallback.

unpack:
    -   source: "/run/archiso/bootmnt/artix/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""

    -   source: "/run/archiso/bootmnt/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
        optional: true

    -   source: "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
        optional: true

    -   source: "/run/archiso/bootmnt/artix/x86_64/filesystem.squashfs"
        sourcefs: "squashfs"
        destination: ""
        optional: true

    -   source: "/run/archiso/bootmnt/filesystem.squashfs"
        sourcefs: "squashfs"
        destination: ""
        optional: true

    -   source: "/run/archiso/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
        optional: true

    -   source: "/run/archiso/bootmnt/LiveOS/squashfs.img"
        sourcefs: "squashfs"
        destination: ""
        optional: true

    -   source: "/LiveOS/squashfs.img"
        sourcefs: "squashfs"
        destination: ""
        optional: true