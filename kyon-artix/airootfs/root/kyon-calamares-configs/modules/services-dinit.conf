#
# Dinit service management — replaces the stock services-systemd module
# for Artix/dinit builds.
---
dontChroot: false
timeout: 120

script:
  # Enable services that should start on the installed system.
  # On Artix/dinit, enabling means symlinking from /usr/lib/dinit.d/ to
  # /etc/dinit.d/ so the service manager picks them up at boot.
  - |
    for svc in networkmanager cupsd avahi-daemon bluetoothd firewalld; do
      src="/usr/lib/dinit.d/$svc"
      dst="/etc/dinit.d/$svc"
      if [ -f "$src" ] && [ ! -e "$dst" ]; then
        ln -sf "$src" "$dst"
        echo "enabled: $svc"
      fi
    done
  # Enable VirtualBox / VMware guest services if present
  - |
    for svc in vboxservice vmtoolsd vmware-vmblock-fuse; do
      src="/usr/lib/dinit.d/$svc"
      dst="/etc/dinit.d/$svc"
      if [ -f "$src" ] && [ ! -e "$dst" ]; then
        ln -sf "$src" "$dst"
        echo "enabled: $svc"
      fi
    done
  # Set graphical login as default (SDDM)
  - |
    if [ -f /usr/lib/dinit.d/graphical ]; then
      ln -sf /usr/lib/dinit.d/graphical /etc/dinit.d/early/00-graphical 2>/dev/null || \
        ln -sf /usr/lib/dinit.d/graphical /etc/dinit.d/graphical
      echo "default target: graphical"
    fi

i18n:
  name: "Configuring Services (Dinit)"
