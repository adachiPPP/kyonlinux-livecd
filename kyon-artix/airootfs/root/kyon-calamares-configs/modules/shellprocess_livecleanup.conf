# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# Remove live-ISO-only state that unpackfs copied into the target system.
# ADAPTED FOR DINIT: removes dinit live service links instead of systemd units.
---
dontChroot: false
timeout: 60

script:
    - "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    # Replace the archiso mkinitcpio preset with the standard one.
    - "sed -e 's|%PKGBASE%|linux|g' -e \"s|^#PRESETS=('default' 'fallback')|PRESETS=('default' 'fallback')|\" -e \"/^PRESETS=('default')$/d\" -e 's|^#fallback_image|fallback_image|' -e 's|^#fallback_options|fallback_options|' /usr/share/mkinitcpio/hook.preset > /etc/mkinitcpio.d/linux.preset"
    - "-rm -f /etc/sddm.conf.d/autologin.conf"
    # Remove dinit live-only service symlinks.
    - "-rm -f /etc/dinit.d/choose-mirror"
    - "-rm -f /etc/dinit.d/livecd-alsa-unmuter"
    - "-rm -f /etc/dinit.d/pacman-init"
    # Remove any systemd leftovers that unpackfs may have copied.
    - "-rm -f /etc/systemd/journald.conf.d/volatile-storage.conf"
    - "-rm -f /etc/systemd/logind.conf.d/do-not-suspend.conf"
    - "-rm -f /etc/systemd/resolved.conf.d/archiso.conf"
    - "-rm -f /etc/systemd/networkd.conf.d/ipv6-privacy-extensions.conf"
    - "-rm -f /etc/systemd/system/choose-mirror.service"
    - "-rm -f /etc/systemd/system/livecd-talk.service"
    - "-rm -f /etc/systemd/system/livecd-alsa-unmuter.service"
    - "-rm -f /etc/systemd/system/multi-user.target.wants/choose-mirror.service"
    - "-rm -f /etc/systemd/system/sound.target.wants/livecd-alsa-unmuter.service"
    - "-rm -f /etc/systemd/system/multi-user.target.wants/pacman-init.service"
    - "-rm -f /etc/systemd/system/pacman-init.service"
    # Live sshd override.
    - "-rm -f /etc/ssh/sshd_config.d/10-archiso.conf"
    # Installer polkit grant.
    - "-rm -f /etc/polkit-1/rules.d/49-calamares.rules"
    # Live ISO root home.
    - "-rm -f /root/.zshrc"
    - "-rm -rf /root/.oh-my-zsh"

i18n:
    name: "Removing live-environment files from target system"
