# SPDX-License-Identifier: CC0-1.0
#
# Top-level configuration for Calamares (Kyon Linux — Artix/Dinit build).
#
# This is written for the Calamares build that this ISO actually ships:
# the EndeavourOS fork, calamares 26.03.2.3 (based on Calamares 3.3.10),
# installed from the `calamares` package in the [endeavouros] repo.
#
# IMPORTANT: the *release* package in the [endeavouros] repo ships only a
# SUBSET of the fork's modules (no shellprocess / partition / unpackfs /
# users / umount / packages / welcome / summary / services-systemd), so an
# ISO built with it alone cannot run this settings.conf - Calamares fails at
# startup with "Module X not found in module search paths" (the bootloader
# step included). airootfs/root/customize_airootfs.sh therefore installs the
# EndeavourOS full-module build (their "calamares-git" devel package) over
# the release package, exactly like EndeavourOS's own ISO build does.
#
# ADAPTED FOR DINIT: the stock `services-systemd` module is NOT used.
# Instead, a shellprocess (services-dinit) enables dinit services via
# symlinks from /usr/lib/dinit.d/ to /etc/dinit.d/.
#
---
modules-search: [ local ]

# Custom module instances.
instances:
  - id:       fix_boot_media
    module:   shellprocess
    config:   shellprocess_fix_boot_media.conf
  - id:       livecleanup
    module:   shellprocess
    config:   shellprocess_livecleanup.conf
  - id:       modify_mk_hook
    module:   shellprocess
    config:   shellprocess_modify_mk_hook.conf
  - id:       initialize_pacman
    module:   shellprocess
    config:   shellprocess_initialize_pacman.conf
  - id:       reset_mk_hook
    module:   shellprocess
    config:   shellprocess_reset_mk_hook.conf
  - id:       build_initramfs
    module:   shellprocess
    config:   shellprocess_build_initramfs.conf
  - id:       bootloader
    module:   shellprocess
    config:   shellprocess_bootloader.conf
  - id:       db
    module:   shellprocess
    config:   shellprocess_db.conf
  - id:       desktop_cleanup
    module:   shellprocess
    config:   shellprocess_desktop_cleanup.conf
  - id:       services_dinit
    module:   shellprocess
    config:   services-dinit.conf
  - id:       btrfs_snapshot
    module:   shellprocess
    config:   shellprocess_btrfs_snapshot.conf
  - id:       copy_skel
    module:   shellprocess
    config:   shellprocess_copy_skel.conf
  - id:       cleanup_calamares
    module:   shellprocess
    config:   shellprocess_cleanup_calamares.conf
  - id:       default
    module:   shellprocess
    config:   shellprocess.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - netinstall
      - users
      - summary
  - exec:
      - partition
      - mount
      # Find airootfs.sfs / vmlinuz-linux on Ventoy, Rufus ISO mode, etc.
      - shellprocess@fix_boot_media
      - unpackfs
      - machineid
      - locale
      - keyboard
      - localecfg
      - fstab
      # Regenerate a clean /etc/mkinitcpio.conf in the target.
      - initcpiocfg
      # Drop live-ISO-only files that unpackfs copied into the target.
      - shellprocess@livecleanup
      # Stage the "don't build initramfs during pacman operations" hook.
      - shellprocess@modify_mk_hook
      - shellprocess@initialize_pacman
      - networkcfg
      - hwclock
      # Install packages: desktop / optional groups + base packages.
      - shellprocess@db
      - packages
      # Create the user and set passwords ONLY AFTER the packages phase.
      - users
      # Drop live-ISO Plasma/SDDM leak, enable SDDM for the chosen desktop.
      - shellprocess@desktop_cleanup
      # Enable dinit services on the installed system.
      - shellprocess@services_dinit
      # Restore the normal mkinitcpio hook and build the initramfs once.
      - shellprocess@reset_mk_hook
      - shellprocess@build_initramfs
      # Install the chosen bootloader.
      - shellprocess@bootloader
      # Post-install: shell setup, snapshots, skel copy, cleanup.
      - shellprocess@default
      - shellprocess@btrfs_snapshot
      - shellprocess@copy_skel
      - shellprocess@cleanup_calamares
      - umount
  - show:
      - finished

branding: kyonlinux

prompt-install: true

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: false

quit-at-end: false
