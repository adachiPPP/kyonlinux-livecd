#
# /etc/pacman.conf — target system config for Kyon Linux (Artix/Dinit)
#
[options]
HoldPkg     = pacman glibc
Architecture = auto

# Kyon ships its own /etc/skel/.zshrc (Oh My Zsh dotfile); never let
# grml-zsh-config's copy overwrite it on upgrades.
NoExtract = etc/skel/.zshrc

Color
ILoveCandy
ParallelDownloads = 5

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

#
# Repositories
#

[kyonrepo]
SigLevel = Optional TrustAll
Server = https://adachiPPP.github.io/kyonrepo/

[system]
Include = /etc/pacman.d/mirrorlist

[world]
Include = /etc/pacman.d/mirrorlist

[galaxy]
Include = /etc/pacman.d/mirrorlist

[cachyos]
SigLevel = Optional TrustAll
Server = https://mirror.cachyos.org/repo/$arch/$repo

[endeavouros]
SigLevel = Optional TrustAll
Server = https://mirror.alpix.eu/endeavouros/repo/$repo/$arch

[nyarch-repo]
SigLevel = Optional TrustAll
Server = https://nyarchlinux.github.io/nyarch-repo/$arch

[chaotic-aur]
SigLevel = Optional TrustAll
Server = https://cdn-mirror.chaotic.cx/$repo/$arch
