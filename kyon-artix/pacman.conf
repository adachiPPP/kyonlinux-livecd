#
# /etc/pacman.conf — build-time config for Kyon Linux (Artix/Dinit ISO)
#
# General pacman options
#
[options]
HoldPkg     = pacman glibc
Architecture = auto

# Kyon installs its own /etc/skel/.zshrc via customize_airootfs.sh after
# packages are installed. Never extract grml-zsh-config's copy over it.
NoExtract = etc/skel/.zshrc

Color
ILoveCandy
ParallelDownloads = 5

SigLevel    = Never
LocalFileSigLevel = Optional

#
# Repositories — Artix Linux
#
# Artix keeps its own [galaxy] repo for Artix-specific packages (init
# systems, service managers, etc.) and also carries [core]/[extra]/[multilib]
# from Arch Linux.  The mirrorlist ships both sets.

[kyonrepo]
SigLevel = Optional TrustAll
Server = https://adachiPPP.github.io/kyonrepo/

[system]
Server = http://mirror1.artixlinux.org/repos/$repo/os/$arch
Server = https://mirrors.dotsrc.org/artix-linux/repos/$repo/os/$arch

[world]
Server = http://mirror1.artixlinux.org/repos/$repo/os/$arch
Server = https://mirrors.dotsrc.org/artix-linux/repos/$repo/os/$arch

[galaxy]
Server = http://mirror1.artixlinux.org/repos/$repo/os/$arch
Server = https://mirrors.dotsrc.org/artix-linux/repos/$repo/os/$arch

[cachyos]
SigLevel = Optional TrustAll
Server = https://mirror.cachyos.org/repo/$arch/$repo

[endeavouros]
SigLevel = Optional TrustAll
Server = https://mirror.alpix.eu/endeavouros/repo/$repo/$arch

[nyarch-repo]
SigLevel = Optional TrustAll
Server = https://nyarchlinux.github.io/nyarch-repo/$arch

[chaotic-aur]
SigLevel = Optional TrustAll
Server = https://cdn-mirror.chaotic.cx/$repo/$arch
